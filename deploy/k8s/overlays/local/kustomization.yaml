apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rag
resources:
  - ../../base
  - documents-pv.yaml
patches:
  - path: patch-config.yaml
    target:
      kind: ConfigMap
      name: rag-config
  - path: patch-embeddings.yaml
    target:
      kind: Deployment
      name: embeddings
