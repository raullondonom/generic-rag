# The repository's documents are mounted into the kind node by scripts/kind-up.sh
# (extraMounts: <repo>/examples/documents -> /mnt/documents).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: documents
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/documents
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: documents
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
