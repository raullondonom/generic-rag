apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rag
resources:
  - ../../base
  - documents-pvc.yaml
# The image is set by deploy.sh from K8S_IMAGE in .env (push it to your registry first, e.g.
# K8S_IMAGE=ghcr.io/your-org/genric-rag-app:1.0.0). Applied without deploy.sh it is genric-rag-app:local.
patches:
  - path: patch-service.yaml
    target:
      kind: Service
      name: nginx
