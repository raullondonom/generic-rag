# Strategic merge patch: Ollama on an NVIDIA GPU. Applied by deploy.sh with GPU=nvidia, or by hand:
#   kubectl -n <namespace> patch deployment ollama --type=strategic \
#     --patch-file deploy/k8s/optional/ollama-gpu-nvidia.patch.yaml
# Requires the NVIDIA device plugin and the "nvidia" RuntimeClass.
# AMD (ROCm): ollama-gpu-amd.patch.yaml.
spec:
  template:
    spec:
      runtimeClassName: nvidia
      containers:
        - name: ollama
          resources:
            limits:
              nvidia.com/gpu: "1"
