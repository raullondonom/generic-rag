# Entry point: the same nginx edge as docker-compose.ha.yml, with Service upstreams.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          env:
            - name: RATE_ASK
              value: "2r/s"
            - name: BURST_ASK
              value: "10"
            - name: RATE_API
              value: "20r/s"
            - name: BURST_API
              value: "40"
            - name: CONN_PER_IP
              value: "100"
            - name: MSG_BUSY
              value: "Too many requests. Try again in a few seconds."
            - name: MSG_DOWN
              value: "Service temporarily unavailable. Try again in a moment."
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
              readOnly: true
      volumes:
        - name: templates
          configMap:
            name: nginx-template
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
