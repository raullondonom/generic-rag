apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rag
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - qdrant.yaml
  - embeddings.yaml
  - ollama.yaml
  - ollama-init-job.yaml
  - app-api.yaml
  - app-scheduler.yaml
  - nginx.yaml
  - hpa.yaml
  - pdb.yaml
configMapGenerator:
  - name: nginx-template
    files:
      - default.conf.template=nginx/default.conf.template
images:
  - name: genric-rag-app
    newTag: local
