# Local embeddings (Hugging Face text-embeddings-inference).
# RAYON_NUM_THREADS follows the CPU limit: with a CFS quota, `nproc` inside the
# container reports the host cores and the model would oversubscribe.
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  labels:
    app: embeddings
spec:
  selector:
    app: embeddings
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
spec:
  replicas: 1
  # ReadWriteOnce volume and a model cache: never two pods at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embeddings
  template:
    metadata:
      labels:
        app: embeddings
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
          args:
            - --model-id
            - $(EMBEDDING_MODEL)
            - --max-client-batch-size
            - "64"
            - --max-batch-tokens
            - "2048"
          env:
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: EMBEDDING_MODEL
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: HF_TOKEN
                  optional: true
            - name: RAYON_NUM_THREADS
              valueFrom:
                resourceFieldRef:
                  containerName: tei
                  resource: limits.cpu
          ports:
            - name: http
              containerPort: 80
          # The first start downloads ~1.2 GB of model weights.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          # No liveness probe: while a full embedding batch uses every CPU, /health can
          # exceed a short timeout. Restarting the model in the middle of an index loses
          # progress and leaves documents in error. Readiness is tolerant for the same reason.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 5Gi
          volumeMounts:
            - name: models
              mountPath: /data
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: hf-models
