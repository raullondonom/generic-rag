apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 75
      initContainers:
        - name: wait-for-postgres
          image: genric-rag-app:local
          command:
            - python
            - -c
            - |
              import socket, time
              while True:
                  try:
                      socket.create_connection(("postgres", 5432), 2).close()
                      break
                  except OSError:
                      print("waiting for postgres", flush=True)
                      time.sleep(2)
      containers:
        - name: app
          image: genric-rag-app:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rag-config
          env:
            - name: ROLE
              value: api
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://rag:$(POSTGRES_PASSWORD)@postgres:5432/rag"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: ADMIN_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: CONFLUENCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: CONFLUENCE_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: documents
              mountPath: /data/docs
              readOnly: true
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: documents
            readOnly: true
