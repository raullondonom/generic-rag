# Enables the NVIDIA GPU for Ollama and for the embeddings. Combined with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# or permanently with COMPOSE_FILE in .env (see .env.example).
services:
  embeddings:
    # The image depends on the GPU architecture (see TEI_GPU_IMAGE in .env.example)
    image: ${TEI_GPU_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:89-1.9}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
