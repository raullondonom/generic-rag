<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#2f6fde">
  <meta name="description" content="Ask your documents, with cited answers.">
  <title>Document RAG</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" id="favicon" href="/icon.svg">
  <link rel="apple-touch-icon" id="touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" data-i18n-label="openMenu" aria-label="Open menu" aria-controls="drawer" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-brand">
        <img class="brand-icon" src="/icon.svg" alt="">
        <h1 id="conv-title" class="topbar-title">Document RAG</h1>
      </div>
      <button id="new-chat-top" class="icon-btn" data-i18n-label="newChat" aria-label="New conversation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <aside id="drawer" class="drawer" data-i18n-label="panel" aria-label="Conversations">
      <div class="drawer-head">
        <div class="brand-block">
          <img class="brand-icon large" src="/icon.svg" alt="">
          <div>
            <div class="brand" id="brand-name">Document RAG</div>
            <div class="muted small" id="brand-tagline"></div>
          </div>
        </div>
        <button id="close-drawer" class="icon-btn" data-i18n-label="closeMenu" aria-label="Close menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button id="new-chat" class="primary wide" data-i18n="newChat">New conversation</button>

      <section class="panel grow">
        <h2 data-i18n="conversations">Conversations</h2>
        <ul id="conv-list" class="conv-list"></ul>
      </section>

      <p class="notice small" id="drawer-notice"></p>
    </aside>
    <div id="backdrop" class="backdrop" hidden></div>

    <main class="main">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div id="context-bar" class="context-bar" hidden></div>
      <form id="form" class="composer">
        <textarea id="question" rows="1" placeholder="Type your question…" data-i18n-label="question" aria-label="Question" required></textarea>
        <button type="submit" id="send" class="send-btn" data-i18n-label="send" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
        <button type="button" id="stop" class="send-btn stop" data-i18n-label="stop" aria-label="Stop answer" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
      </form>
      <p class="footer-notice" id="footer-notice"></p>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
